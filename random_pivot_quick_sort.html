<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let groomi_numbers = [1, 4, 3, 2, 5];
        console.log(groomi_numbers);
        /**
 * 퀵 정렬 함수 (원본 배열 직접 수정)
 * @param {Array} arr - 정렬할 배열
 * @param {number} left - 시작 인덱스
 * @param {number} right - 끝 인덱스
 */
        function quickSort(arr, left = 0, right = arr.length - 1) {
            // 기저 조건: 정렬할 원소가 1개 이하이면 종료
            if (right <= left) {
                return;
            }

            // C++의 uniform_int_distribution 역할 (left 이상 right 이하의 랜덤 정수)
            const randIndex = Math.floor(Math.random() * (right - left + 1)) + left;

            let leftArrow = left + 1;
            let rightArrow = right;

            // 피벗 원소를 랜덤 위치의 원소와 교환 (값 바꾸기 구조 분해 할당)
            [arr[left], arr[randIndex]] = [arr[randIndex], arr[left]];

            let current = left;
            let focusedOnRight = true;

            do {
                if (focusedOnRight) {
                    if (arr[current] >= arr[rightArrow]) {
                        [arr[current], arr[rightArrow]] = [arr[rightArrow], arr[current]];
                        current = rightArrow;
                        focusedOnRight = !focusedOnRight;
                    }
                    --rightArrow;
                } else {
                    if (arr[current] <= arr[leftArrow]) {
                        [arr[current], arr[leftArrow]] = [arr[leftArrow], arr[current]];
                        current = leftArrow;
                        focusedOnRight = !focusedOnRight;
                    }
                    ++leftArrow;
                }
            } while (rightArrow >= leftArrow);

            // 재귀 호출
            quickSort(arr, left, current - 1);
            quickSort(arr, current + 1, right);
        }

        // --- 사용 예시 ---
        const data = [1, 4, 2, 9, 3, 7, 8, 5, 6];
        quickSort(data);
        console.log(data); // 출력: [1, 2, 3, 4, 5, 6, 7, 8, 9]

    </script>
</body>

</html>
